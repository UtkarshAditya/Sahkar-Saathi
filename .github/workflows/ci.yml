# Lint and test on every pull request (architecture doc, Quality tooling; Member A plan task 11).
# The contract is checked from both sides:
# - backend: tests/test_contract.py fails if openapi.json no longer matches the code;
# - frontend: api.gen.ts must match openapi.json, and contract-check.ts fails the build if
#   the UI's types drift from it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (including the openapi.json drift check)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generated API types match the contract
        run: |
          npm run gen:api
          git diff --exit-code src/types/api.gen.ts
      - run: npm run lint
      - run: npm run format:check
      - name: Type-check (including contract-check.ts) and build
        run: npm run build

  # The whole stack exactly as it ships: `docker compose up --build`, then the smoke test
  # against Caddy on http://localhost (Member A plan, task 13).
  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and start the stack
        # The smoke test runs on the stubs, so skip PyTorch and the other ML packages.
        env:
          INSTALL_ML: 'false'
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        run: python scripts/smoke_test.py http://localhost
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
