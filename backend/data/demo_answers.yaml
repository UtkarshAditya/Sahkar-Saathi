# Saved answers for the scripted demo conversations (data/eval/conversations.json), served
# when DEMO_CACHE=true. See apps/chat/demo_cache.py.
#
# Rules, enforced when the file is loaded:
# - `question` is what the user types; it is matched ignoring case, spacing and punctuation.
# - A saved answer that is not a placeholder MUST have a `source` and an `as_of` date, and
#   its text may only say what that source says.
# - Anything else is `is_placeholder: true` and its text says it is a sample. Nothing here
#   may invent a deadline, an amount, a helpline number or a link.
# - Text that was machine-written in Hindi or Tamil has `needs_review: true` until a fluent
#   speaker has checked it.
# - A declined answer has no citations; its contact comes from HELPLINE_LABEL/HELPLINE_DETAIL.
#
# tests/test_demo_cache.py checks that every scripted question has an entry here.

answers:
  # --- 1. PMFBY loss reporting, English ---------------------------------------------------
  - id: pmfby-loss-en
    conversation: pmfby-loss-en
    question: "What should I do if my insured crop is damaged under PMFBY?"
    language: en
    status: answered
    answer_text: >-
      Report the loss within 72 hours of the occurrence of the localized calamity or damage.
      You can report it on the National Crop Insurance Portal (NCIP) or the PMFBY Mobile App,
      or tell the insurance company, the toll-free helpline or your local agriculture office
      directly.
    followups:
      - "Which documents do I need for a crop loss claim?"
    citations:
      - id: demo-pmfby-loss-reporting
        document_id: scheme-pmfby
        title: "Revised Operational Guidelines of Pradhan Mantri Fasal Bima Yojana (PMFBY)"
        publisher: "Ministry of Agriculture & Farmers Welfare, Department of Agriculture & Farmers Welfare"
        published_date: null
        page: null
        section: "Loss reporting rule"
        url: "https://pmfby.gov.in/"
        excerpt: "Within 72 hours of the occurrence of localized calamity or damage"
    source: "backend/services/data/schemes.yaml, scheme pmfby, loss_reporting_rule"
    as_of: 2026-10-22
    is_placeholder: false
    needs_review: false

