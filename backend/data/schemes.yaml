  - slug: pmfby
    title: Pradhan Mantri Fasal Bima Yojana (PMFBY)
    category: insurance
    summary: >-
      Crop insurance that protects farmers against crop loss from natural risks. See the
      Crop insurance guide for step-by-step help.
    eligibility: "Placeholder: see the Crop insurance guide; figures will be added after verification."
    how_to_access: "Placeholder: enrolment routes will be quoted from the verified guidelines."
    source_label: Official scheme page (link to be verified)
    source_url: null
    as_of: 2026-10-01
    is_sample: true
    facts:
      - id: eligibility
        kind: eligibility
        title: Who can enrol
        body: >-
          Farmers growing notified crops in notified areas, including sharecroppers and
          tenant farmers, can generally enrol. The exact conditions will be quoted from the
          verified guidelines.
        source_label: "Pending: schemes.yaml (PMFBY)"
        source_url: null
        as_of: null
        is_placeholder: true
      - id: premium
        kind: premium
        title: Your premium share
        body: >-
          The farmer's premium share for your season and crop type will appear here from the
          verified source. No figure is shown until it is verified.
        source_label: "Pending: schemes.yaml (PMFBY)"
        source_url: null
        as_of: null
        is_placeholder: true
      - id: enrolment
        kind: enrolment
        title: How and where to enrol
        body: >-
          Farmers usually enrol through their bank, PACS, a common service centre or the
          insurance company. The enrolment window for this season will be added from the
          verified source.
        source_label: "Pending: schemes.yaml (PMFBY)"
        source_url: null
        as_of: null
        is_placeholder: true
      - id: loss
        kind: loss-reporting
        title: Reporting crop loss
        body: >-
          Report a loss as early as possible to the insurance company, your bank or the
          agriculture office, with crop, area and cause. The exact reporting time limit will
          be quoted from the guidelines, not estimated.
        source_label: "Pending: schemes.yaml (PMFBY)"
        source_url: null
        as_of: null
        is_placeholder: true
      - id: official
        kind: official-info
        title: Official information and helpline
        body: >-
          The official PMFBY portal and helpline number will be listed here once verified.
          Until then, ask your bank branch, PACS or district agriculture office.
        source_label: "Pending: schemes.yaml (PMFBY)"
        source_url: null
        as_of: null
        is_placeholder: true

